[project]
name = "srm_genesis"
version = "0.1.0"
description = "srm_genesis using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.20,<2.0.0"
]

[project.scripts]
srm_genesis = "srm_genesis.main:run"
run_crew = "srm_genesis.main:run"
train = "srm_genesis.main:train"
replay = "srm_genesis.main:replay"
test = "srm_genesis.main:test"
run_with_trigger = "srm_genesis.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "3fab8c56-2104-423c-86cb-b62bfbfa69eb"

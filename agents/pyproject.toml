[project]
name = "performance-testing-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "tribhargav", email = "thirumalasettinagatribhargav@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "crewai>=1.15.20",
    "crewai-tools>=1.15.20",
    "python-dotenv>=1.2.3",
]

[project.scripts]
performance-testing-ai = "performance_testing_ai.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
